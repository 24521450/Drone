services:
  - type: web
    name: drone-monitoring-api
    runtime: node
    buildCommand: npm ci && npm run build -w backend
    startCommand: npm start -w backend
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        value: admin@drone.local
      - key: ADMIN_PASSWORD
        sync: false

  - type: static_site
    name: drone-monitoring-web
    buildCommand: npm ci && npm run build -w frontend
    staticPublishPath: frontend/dist
    envVars:
      # Set these to the public Render API URL after the API service is created.
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
